apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-deployment
  namespace: tenant-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-app
  template:
    metadata:
      labels:
        app: notes-app
    spec:
      containers:
      - name: notes-app
        image: 320372421165.dkr.ecr.us-east-1.amazonaws.com/notes-app:latest
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 100m
        volumeMounts:
        - name: notes-storage
          mountPath: /app/db
      volumes:
      - name: notes-storage
        emptyDir: {}

