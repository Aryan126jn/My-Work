apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-deployment
  namespace: tenant-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expense-tracker
  template:
    metadata:
      labels:
        app: expense-tracker
    spec:
      containers:
      - name: expense-tracker
        image: 320372421165.dkr.ecr.us-east-1.amazonaws.com/expense-tracker:latest
        ports:
        - containerPort: 5001
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 100m
        volumeMounts:
        - name: expense-storage
          mountPath: /app/db
      volumes:
      - name: expense-storage
        emptyDir: {}

