name: Build & Push Docker Images to ECR

on:
  push:
    branches:
      - Folder-3  # adjust to your branch
  pull_request:
    branches:
      - Folder-3

env:
  AWS_REGION: us-east-1
  IMAGE_TAG: ${{ github.sha }}
  NOTES_ECR_URI: 320372421165.dkr.ecr.us-east-1.amazonaws.com/notes-app
  EXPENSE_ECR_URI: 320372421165.dkr.ecr.us-east-1.amazonaws.com/expense-tracker   

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configure AWS credentials
      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3️⃣ Login to ECR
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin $NOTES_ECR_URI
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin $EXPENSE_ECR_URI

      # 4️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5️⃣ Build and push Notes App
      - name: Build & Push Notes App
        uses: docker/build-push-action@v6
        with:
          context: ./multi-tenant-saas/apps/notes-app
          file: ./multi-tenant-saas/apps/notes-app/Dockerfile
          push: true
          tags: |
            ${{ env.NOTES_ECR_URI }}:latest
            ${{ env.NOTES_ECR_URI }}:${{ github.sha }}

      # 6️⃣ Build and push Expense Tracker
      - name: Build & Push Expense Tracker
        uses: docker/build-push-action@v6
        with:
          context: ./multi-tenant-saas/apps/expense-tracker
          file: ./multi-tenant-saas/apps/expense-tracker/Dockerfile
          push: true
          tags: |
            ${{ env.EXPENSE_ECR_URI }}:latest
            ${{ env.EXPENSE_ECR_URI }}:${{ github.sha }}
