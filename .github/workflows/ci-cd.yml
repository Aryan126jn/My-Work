name: Build and Push Docker Images

on:
  push:
    branches:
      - Folder-3
  pull_request:
    branches:
      - Folder-3

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (for cross-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build and push Notes App
      - name: Build and push Notes App
        uses: docker/build-push-action@v6
        with:
          context: ./multi-tenant-saas/apps/notes-app
          file: ./multi-tenant-saas/apps/notes-app/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/notes-app:latest

      # Step 5: Build and push Expense Tracker App
      - name: Build and push Expense Tracker App
        uses: docker/build-push-action@v6
        with:
          context: ./multi-tenant-saas/apps/expense-tracker
          file: ./multi-tenant-saas/apps/expense-tracker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker:latest
